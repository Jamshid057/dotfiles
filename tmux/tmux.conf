set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'

unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Tokyo Night theme
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Pane chegaralari
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Status bar — Tokyo Night ranglari
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-right "#[fg=#9ece6a]#H #[fg=#a9b1d6]| #[fg=#e0af68]%H:%M "

# Window status
set -g window-status-style "bg=#1a1b26,fg=#a9b1d6"
set -g window-status-current-style "bg=#3d59a1,fg=#c0caf5,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

# Message / komandalar satri
set -g message-style "bg=#3d59a1,fg=#c0caf5"
set -g message-command-style "bg=#3d59a1,fg=#c0caf5"

# Mode (copy-mode tanlash)
set -g mode-style "bg=#3d59a1,fg=#c0caf5"

set-option -g status-position top
